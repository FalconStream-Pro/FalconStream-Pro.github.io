name: Fetch channel logos

# Downloads logos for the Sri Lanka channels into public/logos/lk, copies the
# radio stations' logos into public/logos/lk-radio, and commits them to the branch the workflow runs on.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/fetch_logos.py'
      - 'scripts/self_host_logos.py'
      - 'public/playlists/sri-lanka/radio.m3u'
      - '.github/workflows/fetch-logos.yml'

permissions:
  contents: write

jobs:
  logos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # On pull requests, commit to the PR branch rather than the merge ref
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Install Pillow
        run: pip install pillow

      - name: Download logos
        run: >-
          python3 scripts/fetch_logos.py public/logos/lk
          Rupavahini ChannelEye NethraTV ITN VasanthamTV TVDerana AdaDerana24x7
          SirasaTV ShakthiTV TV1 HiruTV Swarnavahini SiyathaTV JayaTV TalentTV
          VerbumTV TheBuddhist PragnaTV SathiTV TNLTV ImaiTV AhasaTV AsiaTV

      - name: Self-host the radio stations' logos
        run: python3 scripts/self_host_logos.py public/playlists/sri-lanka/radio.m3u public/logos/lk-radio /logos/lk-radio

      - name: Commit logos
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/logos public/playlists/sri-lanka/radio.m3u
          git diff --cached --quiet && { echo "No logo changes"; exit 0; }
          git commit -m "Add self-hosted Sri Lanka channel and radio logos"
          git push
