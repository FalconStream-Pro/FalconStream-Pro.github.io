name: Check Sri Lanka streams

on:
  pull_request:
    paths:
      - 'public/playlists/**'
      - 'scripts/check_streams.py'
      - '.github/workflows/check-streams.yml'
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * 1'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check streams
        run: python3 scripts/check_streams.py public/playlists/sri-lanka/lk.m3u --write-working working-lk.m3u

      - name: Check all known candidate streams
        run: python3 scripts/check_streams.py public/playlists/sri-lanka/sources/candidates.m3u --write-working working-candidates.m3u

      - name: Probe guessed stream URLs
        run: python3 scripts/check_streams.py public/playlists/sri-lanka/sources/probe.m3u

      - name: Look for streams on official channel pages
        run: >-
          python3 scripts/find_streams.py
          https://live.sirasatv.lk/
          https://www.sirasatv.lk/
          https://www.newsfirst.lk/live/
          https://www.yupptv.com/channels/sirasa-tv/live
          https://tvivu.com/watch/sirasa-tv
          https://livetvcentral.com/tv/sirasa-tv
          https://www.peomobile.com/live/live-sirasa-tv

      - name: Upload working playlist
        uses: actions/upload-artifact@v4
        with:
          name: working-lk-m3u
          path: |
            working-lk.m3u
            working-candidates.m3u
