name: Find streams

# Exploratory: looks for stream URLs on channel websites and diagnoses
# streams that pass the stream check but fail in the browser.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/sniff_streams.cjs'
      - 'scripts/diagnose_stream.py'
      - 'scripts/find_streams.py'
      - 'scripts/check_youtube_live.py'
      - 'scripts/bench_player.cjs'
      - 'scripts/find_radio.py'
      - 'public/playlists/sri-lanka/sources/new-candidates.m3u'
      - '.github/workflows/find-streams.yml'

permissions:
  contents: read

jobs:
  find:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Playwright
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium

      - name: Find Sri Lankan radio stations
        run: python3 scripts/find_radio.py radio-lk.m3u LK

      - name: Benchmark the player on the Sri Lanka channels (old vs new hls.js settings)
        env:
          BROWSER_CHANNEL: chrome
        run: node scripts/bench_player.cjs public/playlists/sri-lanka/lk.m3u --configs old,new --rounds 2

      - name: Play the new candidate streams and radio stations in Chrome
        env:
          BROWSER_CHANNEL: chrome
        run: node scripts/bench_player.cjs public/playlists/sri-lanka/sources/new-candidates.m3u radio-lk.m3u

      - name: Diagnose streams that fail in the browser
        run: python3 scripts/diagnose_stream.py https://teledrama.ebc.lk/TTT/proxy.php

      - name: Which official YouTube channels are live now
        # Rupavahini and the other state channels first, then the rest
        run: >-
          python3 scripts/check_youtube_live.py
          UCi0cdSwyCHgPa95_nX457pw
          UC6b6XrsNOxQiS-FdfE8-Avw
          UCQTcNhAZidy1i9wwmdgf2Lw
          UCB5aqOetGShRd8COycdf_PQ
          Nsu5Mxsj4LE
          UCn0XmAUFv6d2tofMFEesSNw
          UCbkMFGQ_RWIf0OiYeOpf6Ng
          UCCK3OZi788Ok44K97WAhLKQ
          UC1WREaxq8LRhdOOmzSFg2pA
          UC37lrcLuvJmWDoooxwiPXXA
          UCSe8uUIt3EM83y9N0WHSx_w
          UC7kBHRaynsJMB6JcooGLTmA
          UCEwh9uOc4CE561y_KHN4Xug
          UCj-bQzHpWB5MtmJoDzizzbw

      - name: Resolve state channels' YouTube handles
        run: >-
          python3 scripts/check_youtube_live.py
          @RupavahiniLK @SLRCRupavahini @rupavahini @RupavahiniTV
          @ChannelEyeSL @channeleye @NethraTV @nethratvlk
          @ITNSriLanka @itntvlk @ITN @VasanthamTV @VasanthamTVSL

      - name: Scan channel pages for stream links
        run: >-
          python3 scripts/find_streams.py
          https://www.rupavahini.lk/
          http://www.rupavahini.lk/live
          https://www.itntv.lk/
          https://www.channeleye.lk/
          https://nethratv.lk/
          https://www.vasantham.lk/

      - name: Record stream requests made by channel pages
        env:
          BROWSER_CHANNEL: chrome
        run: >-
          node scripts/sniff_streams.cjs
          https://www.rupavahini.lk/
          https://www.itntv.lk/
          https://www.channeleye.lk/
          https://nethratv.lk/
          https://online-television.net/3876-rupavahini.html
          https://lakfreedom.info/local-tv-channels
          https://tvgarden.co/countries/sri-lanka
