name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: read

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      # While Settings > Pages > Source is "Deploy from a branch", every push
      # also starts GitHub's Jekyll "pages build and deployment", which
      # publishes the raw repository (README) over this site. Wait for it,
      # so this deploy always lands last.
      - name: Wait for GitHub's branch build to finish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in $(seq 1 40); do
            runs=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$GITHUB_SHA&event=dynamic" \
              --jq '[.workflow_runs[] | select(.name == "pages build and deployment")]')
            total=$(echo "$runs" | jq length)
            pending=$(echo "$runs" | jq '[.[] | select(.status != "completed")] | length')
            if [ "$total" -gt 0 ] && [ "$pending" -eq 0 ]; then echo "Branch build finished"; exit 0; fi
            # No branch build at all after a minute: Pages already uses GitHub Actions
            if [ "$total" -eq 0 ] && [ "$i" -ge 6 ]; then echo "No branch build to wait for"; exit 0; fi
            sleep 10
          done
          echo "Gave up waiting for the branch build"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  verify:
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - uses: actions/checkout@v4

      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium

      - name: Wait for the new version to be served
        run: |
          for i in $(seq 1 30); do
            curl -fsS -o /dev/null https://falconstream-pro.github.io/playlists/sri-lanka/lk.m3u && exit 0
            sleep 10
          done
          echo "Site still not serving the app after 5 minutes"

      - name: Smoke test the live site
        run: node scripts/smoke_test.cjs https://falconstream-pro.github.io --play
        env:
          BROWSER_CHANNEL: chrome
